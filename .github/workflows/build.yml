name: Build and Release Flashcards

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  # JOB 1: CALCULATE NEXT SEMANTIC VERSION AHEAD OF WORKER COMPILATION PASSES
  prepare-version:
    name: Calculate Version Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versioning.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate Next Version Tag
        id: versioning
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n1)
          
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v0.0.1"
          else
            CLEAN_TAG=${LATEST_TAG#v}
            IFS='.' read -r major minor patch <<< "$CLEAN_TAG"
            NEW_PATCH=$((patch + 1))
            NEW_TAG="v$major.$minor.$NEW_PATCH"
          fi
          
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Next version targeted: $NEW_TAG"

  # JOB 2: COMPILE MAC OS BUILDS WITH INTEGRATED DYNAMIC VERSION
  build-mac:
    name: Compile macOS Apps
    needs: prepare-version
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Inject Version into Node Configuration Manifest
        run: |
          CLEAN_VERSION=$(echo "${{ needs.prepare-version.outputs.tag }}" | sed 's/^v//')
          npm version $CLEAN_VERSION --no-git-tag-version

      - name: Package Mac App (Apple Silicon)
        run: npx electron-packager . "USCIS Civics Flashcards" --platform=darwin --arch=arm64 --out=dist/arm64 --overwrite --icon=icons/liberty.icns

      - name: Package Mac App (Intel)
        run: npx electron-packager . "USCIS Civics Flashcards" --platform=darwin --arch=x64 --out=dist/x64 --overwrite --icon=icons/liberty.icns

      - name: Zip Mac Apple Silicon App
        run: |
          cd dist/arm64
          zip -r ../../USCIS-Civics-Flashcards-Mac-AppleSilicon.zip .

      - name: Zip Mac Intel App
        run: |
          cd dist/x64
          zip -r ../../USCIS-Civics-Flashcards-Mac-Intel.zip .

      - name: Upload Mac Apple Silicon Zip Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64-zip
          path: USCIS-Civics-Flashcards-Mac-AppleSilicon.zip

      - name: Upload Mac Intel Zip Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-x64-zip
          path: USCIS-Civics-Flashcards-Mac-Intel.zip

  # JOB 3: COMPILE WINDOWS EXECUTABLE WITH INTEGRATED DYNAMIC VERSION
  build-windows:
    name: Compile Windows App
    needs: prepare-version
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Inject Version into Node Configuration Manifest
        shell: bash
        run: |
          CLEAN_VERSION=$(echo "${{ needs.prepare-version.outputs.tag }}" | sed 's/^v//')
          npm version $CLEAN_VERSION --no-git-tag-version

      - name: Package Windows App
        run: npm run package-win

      - name: Zip Windows App
        shell: powershell
        run: |
          Compress-Archive -Path dist\* -DestinationPath USCIS-Civics-Flashcards-Windows.zip

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v7
        with:
          name: win-zip
          path: USCIS-Civics-Flashcards-Windows.zip

  # JOB 4: DEPLOY FINISHED BINARIES OUT TO THE GITHUB RELEASE SYSTEM
  publish-release:
    name: Deploy to GitHub Releases
    needs: [prepare-version, build-mac, build-windows] 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download Mac Apple Silicon Zip
        uses: actions/download-artifact@v8
        with:
          name: mac-arm64-zip
          path: .

      - name: Download Mac Intel Zip
        uses: actions/download-artifact@v8
        with:
          name: mac-x64-zip
          path: .

      - name: Download Windows Zip
        uses: actions/download-artifact@v8
        with:
          name: win-zip
          path: .

      - name: Update GitHub Release Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          name: "Desktop Builds ${{ needs.needs.prepare-version.outputs.tag }}"
          body: |
            Automated production desktop builds for version ${{ needs.prepare-version.outputs.tag }}.
            
            ### 🚀 Installation Notes:
            * ** macOS (Apple Silicon M1/M2/M3/M4):** Download `USCIS-Civics-Flashcards-Mac-AppleSilicon.zip`.
            * ** macOS (Intel):** Download `USCIS-Civics-Flashcards-Mac-Intel.zip`.
            * *Note for Mac users:* Unzip your respective architecture file, and run `xattr -cr` in Terminal if blocked by Gatekeeper.
            * **❖ Windows:** Download `USCIS-Civics-Flashcards-Windows.zip`, extract the folder, and select *More Info* -> *Run Anyway* if SmartScreen flags it.
          draft: false
          prerelease: false
          files: |
            USCIS-Civics-Flashcards-Mac-AppleSilicon.zip
            USCIS-Civics-Flashcards-Mac-Intel.zip
            USCIS-Civics-Flashcards-Windows.zip